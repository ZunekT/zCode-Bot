name: zxcode

services:
  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://zxcode:${POSTGRES_PASSWORD:-zxcode}@postgres:5432/zxcode
      REDIS_URL: redis://redis:6379
      HTTP_PORT: 3000
    # Port dostępny tylko lokalnie – z internetu wchodzi się przez Caddy (HTTPS).
    ports:
      - '127.0.0.1:${HTTP_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Strona zxcode.pl z panelem klienta. Rozmawia z botem przez wewnętrzne API (port 3100, tylko sieć Dockera).
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    restart: unless-stopped
    environment:
      SITE_URL: ${SITE_URL:-https://zxcode.pl}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      INTERNAL_API_URL: http://bot:3100
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
      DISCORD_INVITE_URL: ${DISCORD_INVITE_URL:-}
    ports:
      - '127.0.0.1:${WEB_PORT:-3001}:3000'
    depends_on:
      - bot

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zxcode
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zxcode}
      POSTGRES_DB: zxcode
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zxcode']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
