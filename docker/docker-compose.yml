name: zxcode

services:
  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://zxcode:${POSTGRES_PASSWORD:-zxcode}@postgres:5432/zxcode
      REDIS_URL: redis://redis:6379
      HTTP_PORT: 3000
    # Port dostępny tylko lokalnie – z internetu wchodzi się przez Caddy (HTTPS).
    ports:
      - '127.0.0.1:${HTTP_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zxcode
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zxcode}
      POSTGRES_DB: zxcode
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zxcode']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
